<html>
  <head>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" type="text/css" href="https://www.gstatic.com/recaptcha/releases/h7qt2xUGz2zqKEhSc8DD8baZ/styles__ltr.css"></head>
  <body>
    <div style="">
      <div id="rc-imageselect" 
        style="height: 300px"
        aria-modal="true" role="dialog">
        <div class="rc-imageselect-response-field"></div>
        <span class="rc-imageselect-tabloop-begin" tabindex="0"></span>
        <div class="rc-imageselect-payload">
          <div class="rc-imageselect-instructions">
            <div class="rc-imageselect-desc-wrapper">
              <div class="rc-imageselect-desc-no-canonical" style="width: 265px; font-size: 14px;">请选择包含
                <strong style="font-size: 28px;">白子必胜</strong>的所有图片</div></div>
            <div class="rc-imageselect-progress"></div>
          </div>
          <div class="rc-imageselect-challenge">
            <div id="rc-imageselect-target" class="rc-imageselect-target" dir="ltr" role="presentation" aria-hidden="true">
              <table class="rc-imageselect-table-33">
                <tbody>
                  <tr>
                    <td role="button" tabindex="4" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">

                          src="https://i.postimg.cc/rsTVxspm/Screenshot-20250629-183322-edit-329830936076658.jpg"
                          alt="" 
                          style="top:0%; left: 0%; width: 165%; height: 165%; transform: translate(-20%, -20%);">
                          <div class="rc-image-tile-overlay"></div>
                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                    <td role="button" tabindex="5" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                          src="https://i.postimg.cc/Qt1NF1hw/Screenshot-20250629-183328-edit-329849090291659.jpg" 
                          alt="" 
                          style="top:0%; left: 0%; width: 165%; height: 165%; transform: translate(-20%, -20%);">
                          <div class="rc-image-tile-overlay"></div>
                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                    <td role="button" tabindex="6" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                          src="https://i.postimg.cc/nL6cV0bq/Screenshot-20250629-184021-edit-329867273526814.jpg"   
                          alt="" style="top:0%; left: 0%; width: 165%; height: 165%; transform: translate(-20%, -20%);">
                          <div class="rc-image-tile-overlay"></div>
                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td role="button" tabindex="7" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                           src="https://i.postimg.cc/TPy3XBSR/Screenshot-20250629-184244-edit-329882927581200.jpg"                          
                           alt="" style="top: 0%; left: 0%; width: 165%; height: 165%; transform: translate(-20%, -20%);">
                          <div class="rc-image-tile-overlay"></div>
                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                    <td role="button" tabindex="8" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                          src="https://i.postimg.cc/VkZkpzKG/Screenshot-20250629-184554-edit-329900248471663.jpg" 
                          alt="" style="top: 0%; left: 0%; width: 165%; height: 165%; transform: translate(-20%, -20%);">
                          <div class="rc-image-tile-overlay"></div>
                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                    <td role="button" tabindex="9" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">

                        </div>
                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td role="button" tabindex="10" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">

                          src="https://i.postimg.cc/SNrsL6Cp/Screenshot-20250629-185043-edit-329952286718127.jpg"

                          <div class="rc-image-tile-overlay"></div>

                        <div class="rc-imageselect-checkbox"></div>
                      </div>
                    </td>
                    <td role="button" tabindex="11" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                          src="https://i.postimg.cc/QxsCW4Bb/Screenshot-20250629-185303-edit-329970195153590.jpg"

                      </div>
                    </td>
                    <td role="button" tabindex="12" class="rc-imageselect-tile" aria-label="图片验证">
                      <div class="rc-image-tile-target">
                        <div class="rc-image-tile-wrapper" style="width: 97px; height: 97px">
                          <img class="rc-image-tile-33" 
                          src="https://i.postimg.cc/057rjRNj/Screenshot-20250629-185639-edit-329985413522514.jpg"

                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="rc-imageselect-incorrect-response" style="display:none">请重试。</div>
          <div aria-live="polite">
            <div class="rc-imageselect-error-select-more" style="display:none">请选择所有相符的图片。</div>
            <div class="rc-imageselect-error-dynamic-more" style="display:none">另外，您还需查看新显示的图片。</div>
            <div class="rc-imageselect-error-select-something" style="display:none">请围绕物体勾勒出一个框；如果未看到任何物体，请重新加载。</div></div>
        </div>
        <div class="rc-footer">
          <div class="rc-separator"></div>
          <div class="rc-controls">
            <div class="primary-controls">
              <div class="rc-buttons">
                <div class="button-holder reload-button-holder">
                  <button class="rc-button goog-inline-block rc-button-reload" title="换一个新的验证码" value="" id="recaptcha-reload-button" tabindex="3"></button>
                </div>
                <div class="button-holder audio-button-holder">
                  <button class="rc-button goog-inline-block rc-button-audio" title="改用音频验证" value="" id="recaptcha-audio-button" tabindex="1"></button>
                </div>
                <div class="button-holder image-button-holder">
                  <button class="rc-button goog-inline-block rc-button-image" title="改用图片验证" value="" id="recaptcha-image-button" tabindex="0" style="display: none;"></button>
                </div>
                <div class="button-holder liveness-button-holder">
                  <button class="rc-button goog-inline-block rc-button-liveness" title="改用手势验证" value="" id="recaptcha-liveness-button" tabindex="0"></button>
                </div>
                <div class="button-holder qr-button-holder" style="display: none;"></div>
                <div class="button-holder help-button-holder">
                  <button class="rc-button goog-inline-block rc-button-help" title="帮助" value="" id="recaptcha-help-button" tabindex="2"></button>
                </div>
                <div class="button-holder undo-button-holder">
                  <button class="rc-button goog-inline-block rc-button-undo" title="撤消" value="" id="recaptcha-undo-button" tabindex="0" style="display: none;"></button>
                </div>
              </div>
              <div class="verify-button-holder">
                <button class="rc-button-default goog-inline-block" title="" value="" id="recaptcha-verify-button" tabindex="0">验证</button></div>
            </div>
            <div class="rc-challenge-help" style="display:none" tabindex="0"></div>
          </div>
        </div>
        <span class="rc-imageselect-tabloop-end" tabindex="0"></span>
      </div>
    </div>
  </body>
</html>
