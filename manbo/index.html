<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:title" content="曼波翻译器">
  <meta property="og:description" content="哈基米哈基米哈基米哈基米莫南北绿豆">
  
  <title>曼波翻译器</title>
  
  <link rel="stylesheet" href="index.css?v=1">
  <script src="./index.js?v=1"></script>
</head>

<body>
  <div class="container">
    <h2 class="title">曼波翻译器</h2>
    <div class="form">
      <textarea class="input" id="input" placeholder="需要加密/解密的内容"></textarea>
      <div class="controls">
        <button class="btn encode" type="button">加密↓</button>
        <button class="btn decode" type="button">解密↓</button>
        <button class="btn clear" type="button">清空✕</button>
        <button class="btn exchange" type="button">交换<span style="font-size: 20px">&#x2195;</spam></button>
      </div>
      <textarea class="input" id="output" placeholder="结果"></textarea>
    </div>
  </div>
</body>

</html>
