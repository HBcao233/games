    <div class="introduction">
      <h2 class="title">星之战</h2>
      <p style="text-indent:2em">星之战是一种逻辑解谜游戏，其规则简单，解题过程富有挑战性。</p>
      <br>
      <p>游戏规则</p>
      <p>按如下要求在格子上放置星星: </p>
      <ul style="-webkit-margin-start: 1em;">
        <li>任意两颗星星不能在横向、纵向或对角上相邻</li>
        <li>对于1★谜题，每行、每列及每宫（粗线条标识）上需放置1颗星星</li>
        <li>对于2★谜题, 每行、每列及每宫（粗线条标识）上需放置2颗星星，以此类推</li>
      </ul>
      <br>
      <p>操作方式：</p>
      <ul style="-webkit-margin-start: 1em;">
        <li><b>左键</b> (手机端为<b>短触</b>): 放置或收回星星</li>
        <li><b>右键</b> (手机端为<b>长按</b>): 标记叉叉</li>
      </ul>
      <br>
      <p>胜利条件：</p>
      <ul style="-webkit-margin-start: 1em;">
        <li>依照规则放置完所有星星</li>
      </ul>
